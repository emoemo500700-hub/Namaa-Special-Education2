.floaties{display:flex;gap:14px;font-size:44px}.floaties.big{font-size:52px;flex-wrap:wrap;justify-content:center}.floaties i{font-style:normal;display:inline-block;animation:flt 1.5s ease-in-out infinite}.floaties i:nth-child(2n){animation-delay:.3s}.floaties i:nth-child(3n){animation-delay:.6s}
.starsr{font-size:56px;display:flex;gap:6px}.starsr i{font-style:normal;filter:grayscale(1) opacity(.3);display:inline-block}.starsr i.on{filter:none;animation:pop2 .7s both,flt 1.6s 1s ease-in-out infinite}
.rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}.rain i{position:absolute;top:-60px;font-style:normal;animation:fall linear infinite}
.bounce{animation:flt 1.1s ease-in-out infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}.jelly{animation:jelly 1.4s ease-in-out infinite;display:inline-block}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.08,.94)}60%{transform:scale(.96,1.06)}}@keyframes pop2{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.vxr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:calc(13px*var(--fs))}.vxr>span:first-child{flex:1;text-align:right}.vxb{display:flex;gap:4px}.vxb button,.vxu{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;color:var(--ink);cursor:pointer;font-size:14px}

.rain{z-index:0!important}#gb{position:relative;z-index:1}.hello{-webkit-text-fill-color:initial!important;background:none!important;color:#0B2545!important;text-shadow:0 2px 0 #fff,0 0 14px rgba(201,151,28,.55)}

/* ===== v0.9.7: واجهة لوحة تحكم احترافية (الرئيسية، الشريط الجانبي، الجداول، النوافذ) ===== */
:root{--gold:#C9971C;--red:#e11d48;--r:18px;--sh:0 1px 2px rgba(11,37,69,.05),0 10px 28px rgba(11,37,69,.07)}

.hd{gap:8px}.nv{box-shadow:0 -6px 24px rgba(11,37,69,.08)}
.nv button{min-height:56px;min-width:0}.nv button svg{flex:none}.nv button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){.br small{display:none}.hd{gap:6px;padding:10px}.bd{padding:5px 8px}}

#sb{width:min(86vw,300px);overscroll-behavior:contain;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sbi{min-height:44px;padding:6px 10px;gap:10px;transition:background .15s}
.sbi svg{flex:none;box-sizing:content-box;width:20px;height:20px;padding:7px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--teal)}
.sbi.on svg{background:var(--card);border-color:var(--gold);color:var(--goldt)}
.sbi:active{background:var(--pill)}
.sbh~.sbi{min-height:40px;font-weight:500;padding-inline:12px}.sbh~.sbi::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.sbh~.sbi.on::before{background:var(--gold)}
/* البطل والبطاقات */
.hero{background:linear-gradient(135deg,#0B2545 0%,#0B5C72 62%,#0E7C86 100%);border-radius:26px;padding:20px 20px 22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;position:relative}.chip svg{flex:none}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pill);color:var(--goldt)}
.ti.wn{background:rgba(201,151,28,.16);color:var(--goldt)}.ti.er{background:rgba(225,29,72,.12);color:var(--red)}
.runc{margin-top:12px;border-color:var(--teal)}.runc .cp{background:none;padding:6px 12px}
.sech{display:flex;align-items:center;gap:10px;margin:22px 0 10px}.sech .st{margin:0;flex:1}
.sech .lnk{margin:0;text-decoration:none;color:var(--teal);font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.qa button{border:1px solid var(--line);box-shadow:var(--sh);border-radius:var(--r);gap:6px;transition:.15s}
.qa button:active{transform:scale(.97);box-shadow:var(--sh)}
.qa em{width:42px;height:42px;border-radius:12px;background:var(--pill);color:var(--goldt);display:grid;place-items:center;font-size:calc(22px*var(--fs))}
/* ودجت إحصاءات الجلسات: حلقة حضور/غياب + أشرطة تقدّم + بلاطات */
.an{padding:16px;margin-top:12px;display:grid;gap:14px}
.an-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}.an-h .st{margin:0}.an-h small{color:var(--mut);font-size:calc(11px*var(--fs))}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);font-weight:700;font-size:calc(12px*var(--fs));padding:7px 12px;border-radius:9px;min-height:34px}
.seg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(11,37,69,.18)}
.live{display:flex;align-items:center;gap:8px;background:rgba(15,181,168,.1);border:1px solid var(--teal);border-radius:12px;padding:8px 10px;font-size:calc(12px*var(--fs))}.live b{flex:1}
.live button{border:0;background:var(--teal);color:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:calc(12px*var(--fs))}
.an-b{display:flex;align-items:center;gap:18px}
.ringw{position:relative;width:132px;height:132px;flex:none}.rg{width:100%;height:100%}
.rg g circle{animation:ring .9s cubic-bezier(.2,.8,.2,1) both}@keyframes ring{from{stroke-dasharray:0 100}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font:800 calc(26px*var(--fs))/1 Cairo;color:var(--ink)}.rc small{font-size:calc(10px*var(--fs));color:var(--mut);margin-top:3px}
.lgd{list-style:none;padding:0;flex:1;display:grid;gap:8px;min-width:0}.lgd li{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fs))}
.lgd i{width:10px;height:10px;border-radius:50%;flex:none}.lgd span{flex:1;color:var(--mut)}.lgd b{font:800 calc(15px*var(--fs)) Cairo}
.lgd .tot{border-top:1px dashed var(--line);padding-top:8px}.lgd .tot span{color:var(--ink);font-weight:700}
.pbs{display:grid;gap:12px}.pbt{display:flex;justify-content:space-between;font-size:calc(13px*var(--fs));font-weight:700}.pbt b{color:var(--teal);font-family:Cairo}
.bar2{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#0FB5A8);transform-origin:right;animation:grow .8s ease both}@keyframes grow{from{transform:scaleX(0)}}
.pb small{color:var(--mut);font-size:calc(11px*var(--fs))}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tl{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tl .ti{width:30px;height:30px;border-radius:10px}.tl b{font:800 calc(18px*var(--fs)) Cairo}.tl small{font-size:calc(10px*var(--fs));color:var(--mut)}
@media (max-width:360px){.an-b{flex-direction:column}.ringw{width:120px;height:120px}.lgd{width:100%}}
/* جدول الحضور والغياب */
.tc{padding:12px}.tf{display:grid;gap:8px}.tf select{margin:0;padding:9px 12px;font-size:14px}.tf .chs{padding-bottom:4px}
.tw{overflow-x:auto;margin-top:6px}.dt{width:100%;border-collapse:collapse;min-width:300px}
.dt th{font-size:calc(11px*var(--fs));color:var(--mut);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:700}
.dt td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:right;font-size:calc(13px*var(--fs))}
.dt tr:last-child td{border-bottom:0}.dt tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg) 60%,transparent)}
.dt td b,.dt small{display:block}.dt small{color:var(--mut);font-size:calc(11px*var(--fs));line-height:1.5}
.bdg{display:inline-block;border-radius:99px;padding:3px 10px;font-size:calc(11px*var(--fs));font-weight:700;border:1px solid;white-space:nowrap}
.bdg.p{color:var(--teal);border-color:var(--teal);background:rgba(15,181,168,.1)}.bdg.a{color:var(--red);border-color:var(--red);background:rgba(225,29,72,.08)}.bdg.e{color:var(--goldt);border-color:var(--gold);background:rgba(201,151,28,.12)}
.ib.sm{width:34px;height:34px;border-radius:10px}
/* النوافذ: شريحة سفلية على الجوال، وتمركز دقيق في الوسط على الشاشات الأكبر */
.sh{max-height:92vh;overflow:auto}.sh::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:-8px auto 12px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.mh b{font:800 calc(17px*var(--fs)) Cairo}
@media (min-width:640px){.ov{align-items:center}.sh{border-radius:24px;padding-bottom:20px;animation:fd .25s}.sh::before{display:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 label{min-width:0}@media (max-width:340px){.row2{grid-template-columns:1fr}}
.dd{background:var(--pill);color:var(--goldt);border:1px dashed var(--gold);border-radius:12px;padding:8px 10px;margin:8px 0;text-align:center;font-weight:700;font-size:calc(12px*var(--fs));line-height:1.8}
.rps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.rps div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center}
.rps b{display:block;font:800 calc(18px*var(--fs)) Cairo;color:var(--teal)}.rps small{color:var(--mut);font-size:calc(11px*var(--fs))}
.pfg{border-top:1px dashed var(--line);padding:4px 0}.pfs{margin:2px 0 6px;padding:6px 8px;background:var(--bg);border-radius:12px}
.pfr{display:flex;align-items:center;gap:8px;padding:4px 0}.pfr span{flex:1;font-size:calc(12px*var(--fs))}.pfr select{width:auto;margin:0;padding:6px 8px;font-size:14px}
.hero::after{background:radial-gradient(circle,rgba(201,151,28,.38),transparent 68%)}

const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LW=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const LD=k=>{try{localStorage.removeItem(k)}catch(e){}};
const b64=a=>{const u=new Uint8Array(a);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder(),td=new TextDecoder();
async function mk(pin,salt){const m=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(o,k){const iv=crypto.getRandomValues(new Uint8Array(12));
 return{iv:b64(iv),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(o))))}}
async function dec(o,k){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.d))))}

let S=null,K=null,salt=null;
async function save(){
 if(K){const o=await enc(S,K);o.s=b64(salt);LW('namaa_enc',JSON.stringify(o));LD('namaa_data')}
 else{LW('namaa_data',JSON.stringify(S));LD('namaa_enc')}}

/* ===== شاشة الدخول / إنشاء الرمز ===== */
function auth(mode){const L=mode==='lock';
 document.body.innerHTML=`<div class="au"><div class="lg">🌱</div><h1>نماء</h1>
 <p>${L?'أدخل رمز الدخول':'أنشئ رمزاً من ٤ إلى ٦ أرقام لحماية بيانات طلابك'}</p>
 <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••" aria-label="الرمز" onkeydown="if(event.key==='Enter')${mode}Go()">
 <button class="btn" onclick="${mode}Go()">${L?'دخول':'حفظ الرمز'}</button>
 ${L?'<button class="lnk" onclick="forgot(this)">نسيت الرمز؟ مسح البيانات</button><button class="lnk" onclick="recUI()">لدي مفتاح الاسترجاع</button>':'<button class="lnk" onclick="skipPin()">تخطّي الآن</button>'}
 <div id="err"></div></div>`;$('#pin').focus()}
function bad(m){$('#err').textContent=m;const a=$('.au');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
async function lockGo(){try{const o=JSON.parse(LS('namaa_enc'));salt=ub(o.s);K=await mk($('#pin').value,salt);S=await dec(o,K);shell()}
 catch(e){K=null;bad('الرمز غير صحيح، حاول مرة أخرى')}}
async function setupGo(){const p=$('#pin').value;if(!/^\d{4,6}$/.test(p))return bad('الرمز يجب أن يكون ٤ إلى ٦ أرقام');
 salt=crypto.getRandomValues(new Uint8Array(16));K=await mk(p,salt);S=clone(SEED);await save();const r=await mkRec(p);shell();showRec(r)}

/* ---------- 04b-import-guard.js ---------- */
/* ===== حارس الاستيراد (أمان) =====
   أي نسخة احتياطية تمر من cleanBackup() قبل أن تصير الحالة S. السبب: معرّفات الأهداف والجلسات تدخل في خصائص onclick،
   فملف معدّل خبيثاً كان يستطيع حقن كود. هنا: تحقق من الهيكل + حدود الأطوال + تنقية المعرّفات + حذف أي مفاتيح غير معروفة. */
const SAFE_ID=/^[A-Za-z0-9_-]{1,48}$/,BAD_KEY=new Set(['__proto__','constructor','prototype']),ISO_D=/^\d{4}-\d\d-\d\d$/,ST_OK=new Set(['mastered','progress','prompted','not','new']);
const gStr=(v,n=500)=>typeof v==='string'?v.slice(0,n):'';
const gNum=(v,d=0)=>Number.isFinite(+v)?+v:d;
const gInt=v=>Number.isFinite(+v)?Math.trunc(+v):null;
const gArr=v=>Array.isArray(v)?v:[];
function idMapper(){const m=new Map();return v=>{v=String(v==null?'':v);if(SAFE_ID.test(v))return v;if(!m.has(v))m.set(v,'x'+Math.random().toString(36).slice(2,10));return m.get(v)}}
/* نسخة عميقة آمنة لبيانات حرة (إعدادات/حزم): بلا مفاتيح خطرة ولا دوال ولا أعماق مفرطة */
function gPlain(v,d=0){if(d>6)return null;if(typeof v==='string')return v.slice(0,2000);if(typeof v==='number'||typeof v==='boolean'||v===null)return v;
 if(Array.isArray(v))return v.slice(0,500).map(x=>gPlain(x,d+1));
 if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v)){if(!BAD_KEY.has(k)&&k.length<80)o[k]=gPlain(v[k],d+1)}return o}return null}
const gPrim=o=>{const r={};if(o&&typeof o==='object')for(const k of Object.keys(o)){if(BAD_KEY.has(k)||k.length>60)continue;const v=o[k];if(typeof v==='string')r[k]=v.slice(0,1000);else if(typeof v==='number'||typeof v==='boolean')r[k]=v}return r};
function cleanSubGoal(z,id){return Object.assign(gPrim(z),{id:id(z.id||uid()),title:gStr(z.title,500),status:ST_OK.has(z.status)?z.status:'new',need:Math.min(5,Math.max(2,gInt(z.need)||3)),
 log:gArr(z.log).slice(-400).map(a=>({r:'mpn'.includes(a&&a.r)&&a.r?a.r:'n',t:gNum(a&&a.t),s:a&&a.s!=null?id(a.s):undefined}))})}
function cleanShortGoal(g,id){const o=Object.assign(gPrim(g),{id:id(g.id||uid()),title:gStr(g.title,500),subGoals:gArr(g.subGoals).filter(z=>z&&typeof z==='object').map(z=>cleanSubGoal(z,id))});
 if(Array.isArray(g.items))o.items=g.items.slice(0,40).map(i=>({e:gStr(i&&i.e,16),w:gStr(i&&i.w,60)}));return o}
function cleanIep(iep,sids,id){const out={};for(const sid of Object.keys(iep&&typeof iep==='object'?iep:{})){if(!sids.has(+sid))continue;out[+sid]={};
 for(const sub of Object.keys(iep[sid]||{})){const x=iep[sid][sub];if(BAD_KEY.has(sub)||!x||typeof x!=='object')continue;
  out[+sid][sub.slice(0,120)]=Object.assign(gPrim(x),{longTermGoal:gStr(x.longTermGoal,1000),shortTermGoals:gArr(x.shortTermGoals).filter(g=>g&&typeof g==='object').map(g=>cleanShortGoal(g,id))})}}return out}
function cleanSessions(a,sids,id){return gArr(a).filter(z=>z&&typeof z==='object'&&sids.has(gInt(z.sid))&&ISO_D.test(z.d)).map(z=>({id:id(z.id||uid()),sid:gInt(z.sid),d:z.d,dur:Math.min(1000,Math.max(0,gNum(z.dur))),att:'pae'.includes(z.att)&&z.att?z.att:'p',
 gs:gArr(z.gs).map(id),note:gStr(z.note,2000),t0:gNum(z.t0),open:z.open?1:0}))}
function cleanSnaps(a){return gArr(a).slice(-80).filter(x=>x&&ISO_D.test(x.d)).map(x=>{const m={};for(const k of Object.keys(x.m||{})){const v=x.m[k];if(/^\d+$/.test(k)&&Array.isArray(v))m[k]=[gNum(v[0]),gNum(v[1])]}return{t:gNum(x.t),d:x.d,m}})}
function cleanBackup(d){if(!d||typeof d!=='object'||!Array.isArray(d.students))throw new Error('هيكل النسخة غير صالح');

const pad2=n=>String(n).padStart(2,'0');
const tHM=ts=>{const x=new Date(ts);return pad2(x.getHours())+':'+pad2(x.getMinutes())};
const okHM=s=>/^\d\d:\d\d$/.test(s||'');
/* ١٤:٣٠ ← ٠٢:٣٠ م */
const tAr=hm=>{if(!okHM(hm))return'';const[h,m]=hm.split(':').map(Number);return arn(pad2(h%12||12)+':'+pad2(m))+(h<12?' ص':' م')};
/* طابع زمني (ms) لتاريخ YYYY-MM-DD ووقت HH:MM، مع إزاحة بالدقائق */
const tsOf=(d,hm,addMin=0)=>new Date(dstr(d)+'T'+(okHM(hm)?hm:'09:00')+':00').getTime()+addMin*6e4;
/* وقت بدء الجلسة: المحفوظ يدوياً، وإلا من لحظة البدء الفعلية t0 */
const sessTm=z=>okHM(z.tm)?z.tm:(z.t0?tHM(z.t0):'');
const sessEnd=z=>{const s=sessTm(z);return s&&z.dur?tHM(tsOf(z.d,s,z.dur)):''};
const sessSpan=z=>{const s=sessTm(z);return s?tAr(s)+(sessEnd(z)?' – '+tAr(sessEnd(z)):''):'—'};

/* ===== الأثر الرجعي: ربط المحاولات بتاريخ الجلسة ووقتها ===== */
/* كل محاولات جلسة (من خطة طالبها) */
const sessAtt=z=>sgs(z.sid).flatMap(sg=>(sg.log||[]).filter(a=>a.s===z.id).map(a=>({sg,a})));
const sgOf=(sid,id)=>sgs(sid).find(x=>x.id===id);
/* حالة الهدف الفرعي من آخر محاولة (نفس قاعدة logA لكن على السجل المرتّب زمنياً) */
function restat(sg){const L=sg.log||[],a=L[L.length-1];if(!a)return;const n=sg.need||3,t=L.slice(-n),ok=a.r==='m'&&t.length>=n&&t.every(x=>x.r==='m');
 sg.status=a.r==='n'?'not':a.r==='p'?'prompted':(ok||sg.status==='mastered')?'mastered':'progress'}
/* يضع نتيجة واحدة لهدف فرعي ضمن الجلسة (يُبقي المحاولات الحالية إن كانت نفس النتيجة) */
function setResult(z,sg,r,i){const mine=(sg.log||[]).filter(a=>a.s===z.id),last=mine[mine.length-1];
 if(last&&last.r===r)return;
 sg.log=(sg.log||[]).filter(a=>a.s!==z.id).concat({r,t:tsOf(z.d,sessTm(z),i),s:z.id}).sort((a,b)=>a.t-b.t).slice(-400);restat(sg)}
/* تثبيت الجلسة على محورها الزمني: تحريك محاولاتها إلى تاريخها (عند تغيير التاريخ/الوقت أو عدم التطابق) */
function normSess(z,force){const tm=sessTm(z);if(tm)z.tm=tm;const t0=tsOf(z.d,tm),A=sessAtt(z).sort((x,y)=>x.a.t-y.a.t);
 if(A.length&&(force||A.some(x=>ymd(x.a.t)!==z.d))){const b=A[0].a.t;A.forEach(x=>{x.a.t=t0+(x.a.t-b)});new Set(A.map(x=>x.sg)).forEach(sg=>{sg.log.sort((p,q)=>p.t-q.t);restat(sg)})}
 if(!z.open&&tm)z.t0=t0;
 if(z.d<ymd())z.bf=1;else delete z.bf}
/* عند إنهاء جلسة حيّة بتاريخ سابق: تُنقل محاولاتها لتاريخها تلقائياً */
{const _end=endSess;endSess=async function(){const z=S.sess.find(x=>x.id===S.run);if(z)z.tm=sessTm(z)||tHM(Date.now());await _end();if(z){normSess(z);await save()}}}

 try{await loadH2P();h=document.createElement('div');h.style.cssText='position:fixed;left:-9999px;top:0;width:794px;background:#fff';h.innerHTML=`<style>${DS}</style><div class="nd">${irHTML(DOCIR)}</div>`;document.body.appendChild(h);

 catch(e){if(h)h.remove();toast('تعذّر إنشاء PDF (يحتاج إنترنت). استخدم Word أو HTML أو الطباعة')}
 b.textContent=o;b.disabled=false}

const numOpts=(ans,Q)=>{const R=Math.max(Q.R||10,ans+2),s=new Set([ans]);let c=0;while(s.size<Q.no&&c++<80)s.add(Math.max(0,Math.min(R,ans+rnd(-3,3))));return sh([...s]).map(n=>({h:arn(n),k:String(n)}))};
function mkQ(type,Q,i,deck){const it=deck[i%Math.max(1,deck.length)]||{e:'❓',w:'؟'};
 if(type==='choose'||type==='balloon'){const o=sh([it,...sh(Q.items.filter(x=>x!==it)).slice(0,Q.no-1)]);return{stim:it.e,pr:'ما اسم هذه الصورة؟',opts:o.map(x=>({h:esc(x.w),k:x.w})),ans:it.w,st:type==='balloon'?'bl':'op'}}
 if(type==='pick'){const o=sh([it,...sh(Q.items.filter(x=>x!==it)).slice(0,Q.no-1)]);return{stim:esc(it.w),sc:'wd',pr:'اضغط على الصورة المناسبة',opts:o.map(x=>({h:x.e,k:x.w})),ans:it.w,st:'op pk'}}
 if(type==='firstl'){const a=firstL(it.w),o=sh([a,...sh(Object.keys(LET).filter(x=>x!==a)).slice(0,Q.no-1)]);return{stim:it.e,sub:Q.lv===1?it.w:'',pr:'ما الحرف الأول في اسم الصورة؟',opts:o.map(x=>({h:x,k:x})),ans:a,st:'op lt'}}
 if(type==='count'){const n=rnd(1,Math.min(Q.R,10)),e=p1(NUME);return{stim:Array(n).fill(e).join(' '),sc:'cn',pr:'كم عدد الصور؟',opts:numOpts(n,Q),ans:String(n),st:'op lt'}}
 if(type==='arith'){let op=Q.f.add&&!Q.f.sub?'+':Q.f.sub&&!Q.f.add?'−':p1(['+','−']),R=Math.max(3,Q.R),a,b,r;
  if(op==='+'){a=rnd(1,R-1);b=rnd(1,R-a);r=a+b}else{a=rnd(2,R);b=rnd(1,a-1);r=a-b}const e=p1(NUME),vis=R<=10?`<div class="qsub">${op==='+'?Array(a).fill(e).join('')+' ＋ '+Array(b).fill(e).join(''):Array(a).fill(e).join('')+' ← أخذنا '+arn(b)}</div>`:'';
  return{stim:arn(a)+' '+(op==='+'?'＋':'−')+' '+arn(b)+' = ؟',sc:'wd',after:vis,pr:'احسب الناتج',opts:numOpts(r,Q),ans:String(r),st:'op lt'}}
 return null}
function mkPairs(Q,k,ty){if(Q.kind==='math'){const mx=ty==='memory'?10:6,ns=sh(Array.from({length:Math.min(mx,Math.max(Q.R,k+1))},(_,i)=>i+1)).slice(0,k);
  return ns.map(n=>ty==='memory'?{a:arn(n),b:NUMW[n]}:{a:Array(n).fill(NUME[n%NUME.length]).join(''),b:arn(n)})}
 return sh(Q.items).slice(0,k).map(x=>({a:x.e,b:x.w}))}
function mkSort(Q){const n=[4,6,8][Q.lv-1]||6,h=n/2;
 if(Q.kind==='letter'){const L=Q.l||p1(Object.keys(LET)),A=sh(P(LET[L])).slice(0,h),o=sh(Object.keys(LET).filter(x=>x!==L)).slice(0,h).map(x=>p1(P(LET[x])));
  return{bins:['يبدأ بحرف ('+L+')','لا يبدأ بحرف ('+L+')'],pr:'ضع الصور التي تبدأ بحرف ('+L+') في السلة الأولى',its:sh([...A.map(x=>({...x,b:0})),...o.map(x=>({...x,b:1}))])}}
 const cats=Object.keys(LIBS),c0=Q.cat||(Q.items.length>=h&&Q.name?null:p1(cats)),c1=p1(cats.filter(x=>x!==(c0||Q.cat))),A=c0?P(LIBS[c0]):Q.items;
 return{bins:[c0||Q.name,c1],pr:'ضع كل صورة في السلة المناسبة لها',its:sh([...sh(A).slice(0,h).map(x=>({...x,b:0})),...sh(P(LIBS[c1])).slice(0,h).map(x=>({...x,b:1}))])}}
function mkOrder(Q){const k=[3,4,5][Q.lv-1]||4,top=Math.max(Q.R,k+1),nums=sh(Array.from({length:top},(_,i)=>i+1)).slice(0,k),asc=Q.lv<3||Math.random()<.7;
 return{shuf:sh(nums),tgt:[...nums].sort((a,b)=>asc?a-b:b-a),asc}}
function traceGlyph(Q){if(Q.kind==='math'){const d=rnd(1,Math.min(9,Math.max(Q.R,3)));return{g:arn(d),nm:'الرقم '+arn(d)}}const l=Q.l||p1(Object.keys(LET));return{g:l,nm:'الحرف ('+l+')'}}

const GAMES={choose:()=>mcq('choose'),pick:()=>mcq('pick'),balloon:()=>mcq('balloon'),firstl:()=>mcq('firstl'),count:()=>mcq('count'),arith:()=>mcq('arith'),match:gMatch,drag:gDrag,memory:gMemory,trace:gTrace,sort:gSort,order:gOrder};
function nextAct(){const G=GS;if(!G)return;if(G.pi>=G.pl.length)return finish();const t=G.pl[G.pi],idx=G.pi,n=G.pl.length,last=idx===n-1&&n>1;
 $('#gt').textContent=TYN[t]+' · '+G.tname;$('#gp').textContent=ar(idx+1)+'/'+ar(n);sfx('go');
 $('#gb').innerHTML=`<div class="stg"><div class="bigem bounce">${TYI[t]}</div><h2 class="hello sm">${last?'آخر لعبة!':'اللعبة '+ar(idx+1)}</h2><p class="stgp big">${TYN[t]}</p></div>`;
 if(idx>0)say([last?'tr_last':idx===Math.floor(n/2)?'tr_half':'tr_next']);
 setTimeout(()=>{if(GS!==G||G.pi!==idx)return;GAMES[t]();say(['i_'+t])},idx>0?1700:1000)}
function done(ok,tot){const G=GS;if(!G)return;G.per.push({t:G.pl[G.pi],ok,tot});G.ok+=ok;G.tot+=tot;G.pi++;if(tot&&ok/tot>=.8)conf();setTimeout(()=>{if(GS===G)nextAct()},900)}

/* ---- أسئلة الاختيار من متعدد: اختيار، اختر الصورة، بالونات، الحرف الأول، عدّ، حساب ---- */
function mcq(type){const G=GS,Q=G.Q,c=G.cfg,N=c.n,deck=deckFor(type,Q),my=G.pi;let i=0,ok=0;
 const next=()=>{if(GS!==G||G.pi!==my)return;clearInterval(G.tm);if(i>=N)return done(ok,N);const q=mkQ(type,Q,i,deck);let bad=0,hit=0;
  $('#gb').innerHTML=`<div class="qs">${qh(i,N)}<div class="qe ${q.sc||''}">${q.stim}</div>${q.sub?`<div class="qsub">${esc(q.sub)}</div>`:''}${q.after||''}<p class="qp">${q.pr}</p>
  <div class="${q.st}">${q.opts.map((o,j)=>`<button class="${q.st==='bl'?'bn b'+(j%5):q.st==='op pk'?'ob pe':'ob'}${c.big!==0?' lg':''}" data-k="${esc(o.k)}">${o.h}</button>`).join('')}</div><div class="tmr" id="tmr"></div></div>`;
  document.querySelectorAll('#gb [data-k]').forEach(x=>x.onclick=()=>{
   if(hit)return;if(x.dataset.k===q.ans){hit=1;clearInterval(G.tm);sfx(q.st==='bl'?'pop':'ok');if(!bad)ok++;x.classList.add('good');if(q.st==='bl')x.classList.add('pop');document.querySelectorAll('#gb [data-k]').forEach(z=>z.style.pointerEvents='none');praise();i++;setTimeout(next,1200)}
   else{bad++;sfx('bad');x.classList.add('bad');x.disabled=true;if(bad===2)say([p1(['e1','e2','e3'])])}});
  if(c.tm){let t=c.tm;$('#tmr').textContent='⏱ '+ar(t);G.tm=setInterval(()=>{t--;const e=$('#tmr');if(e)e.textContent='⏱ '+ar(t);if(t<=0){clearInterval(G.tm);i++;next()}},1000)}};
 next()}

 const line=(a,b)=>{const m=$('#mt').getBoundingClientRect(),p=r=>[r.left+r.width/2-m.left,r.top+r.height/2-m.top],A=p(a.getBoundingClientRect()),B=p(b.getBoundingClientRect()),l=document.createElementNS('http://www.w3.org/2000/svg','line');

/* ---- سحب وإفلات (مساعد مشترك للسحب والفرز) ---- */
function dnd(sel,onDrop,onTap){document.querySelectorAll(sel).forEach(c=>{let sx=null,sy,mv=0;
 c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;mv=0;c.classList.add('hold')};
 c.onpointermove=e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mv=1;c.style.transform=`translate(${dx}px,${dy}px)`};
 c.onpointerup=e=>{if(sx==null)return;sx=null;c.classList.remove('hold');c.style.transform='';if(!mv)return onTap&&onTap(c);
  const t=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('slot')&&!x.classList.contains('full'));onDrop(c,t||null)}})}

/* ---- كتابة الحرف أو الرقم بالإصبع (يُقاس تغطية الشكل وعدم الخروج عنه) ---- */
function gTrace(){const G=GS,Q=G.Q,N=3,W=360,my=G.pi;let i=0,ok=0;
 const step=()=>{if(GS!==G||G.pi!==my)return;if(i>=N)return done(ok,N);const gl=traceGlyph(Q);let tries=0;
  $('#gb').innerHTML=`<div class="qs">${qh(i,N)}<p class="qp">اكتب ${gl.nm} بإصبعك فوق الشكل</p><div class="trw"><canvas id="tc" width="${W}" height="${W}"></canvas></div><div class="trb"><button class="btn g" id="tclr">🧽 مسح</button><button class="btn" id="tok">✔ تمّ</button></div></div>`;
  const cv=$('#tc'),cx_=cv.getContext('2d'),ink=document.createElement('canvas');ink.width=ink.height=W;const ic_=ink.getContext('2d');ic_.lineWidth=32;ic_.lineCap=ic_.lineJoin='round';ic_.strokeStyle='#0E7C86';
  let font,gx=W/2,cy=W/2;const fit=()=>{let fs=290,m;for(;fs>120;fs-=20){cx_.font=font=`800 ${fs}px Cairo,Tajawal,Arial,sans-serif`;cx_.textAlign='center';cx_.textBaseline='alphabetic';m=cx_.measureText(gl.g);if(m.width<W*.8&&(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)<W*.78)break}
   gx=W/2+((m.actualBoundingBoxLeft||0)-(m.actualBoundingBoxRight||0))/2;cy=W/2+((m.actualBoundingBoxAscent||0)-(m.actualBoundingBoxDescent||0))/2};fit();
  const mask=lw=>{const m=document.createElement('canvas');m.width=m.height=W;const c=m.getContext('2d');c.font=font;c.textAlign='center';c.textBaseline='alphabetic';if(lw){c.lineWidth=lw;c.lineJoin='round';c.strokeStyle='#000';c.strokeText(gl.g,gx,cy)}c.fillStyle='#000';c.fillText(gl.g,gx,cy);return c.getImageData(0,0,W,W).data};
  const draw=()=>{cx_.clearRect(0,0,W,W);cx_.font=font;cx_.textAlign='center';cx_.textBaseline='alphabetic';cx_.fillStyle='#e8ecf1';cx_.fillText(gl.g,gx,cy);cx_.setLineDash([9,9]);cx_.lineWidth=3;cx_.strokeStyle='#94a3b8';cx_.strokeText(gl.g,gx,cy);cx_.setLineDash([]);cx_.drawImage(ink,0,0)};
  const score=()=>{const g=mask(0),gd=mask(50),d=ic_.getImageData(0,0,W,W).data;let gt=0,gc=0,dt=0,sp=0;for(let p=3;p<g.length;p+=4){const a=g[p]>60,b=d[p]>60;if(a){gt++;if(b)gc++}if(b){dt++;if(gd[p]<=60)sp++}}return{cov:gt?gc/gt:0,spill:dt?sp/dt:1,dt}};
  let fin=0;const win=()=>{if(fin)return;fin=1;sfx('ok');praise();if(!tries)ok++;i++;setTimeout(step,1200)};
  let dn=false,lx,ly;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);dn=true;[lx,ly]=pt(e);ic_.beginPath();ic_.moveTo(lx,ly);ic_.lineTo(lx+.1,ly);ic_.stroke();draw()};
  cv.onpointermove=e=>{if(!dn)return;const[x,y]=pt(e);ic_.beginPath();ic_.moveTo(lx,ly);ic_.lineTo(x,y);ic_.stroke();lx=x;ly=y;draw()};

  $('#tok').onclick=()=>{const s=score();if(s.dt<200){sfx('bad');return toast('ارسم الحرف بإصبعك أولاً ✏️')}

  draw();if('fonts'in document)document.fonts.ready.then(()=>{fit();draw()})};
 step()}
